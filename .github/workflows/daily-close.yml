name: 매일 종가 기록

on:
  schedule:
    # 화~토 07:13 KST (UTC 22:13 월~금): 전날 한국장·미국장 종가가 모두 확정된 뒤
    - cron: "13 22 * * 1-5"
  workflow_dispatch:
    inputs:
      period:
        description: "가져올 기간 (예: 7d, 1mo, 3mo, 1y)"
        default: "7d"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_prices.py --period "${{ inputs.period || '7d' }}"
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "새 데이터 없음"
          else
            git commit -m "종가 기록 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
